<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Popup styles */
        .popup {
            display: none; /* Hidden by default */
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
        .popup h3 {
            text-align: center;
        }
        .popup .close {
            display: block;
            margin: 10px auto;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .popup .close:hover {
            background-color: #0056b3;
        }
        /* Overlay */
        .overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form method="POST" action="/login" onsubmit="return validateForm()">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/register_page">Register here</a></p>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Popup -->
    <div class="popup" id="resultPopup">
        <h3 id="resultMessage"></h3>
        <button class="close" onclick="closePopup()">Close</button>
    </div>

    <script>
        // Check if there is a flash message for invalid login
        const flashMessage = "{{ get_flashed_messages()|join(', ') }}";
        if (flashMessage) {
            showPopup(flashMessage);
        }

        function showPopup(message) {
            const resultMessage = document.getElementById('resultMessage');
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('resultPopup');

            // Set the message
            resultMessage.innerHTML = message;

            // Show the overlay and popup
            overlay.style.display = 'block';
            popup.style.display = 'block';
        }

        function closePopup() {
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('resultPopup');

            // Hide the overlay and popup
            overlay.style.display = 'none';
            popup.style.display = 'none';
        }
    </script>
</body>
</html>
